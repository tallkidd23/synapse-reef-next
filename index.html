<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07130d" />
  <title>Digital Paludarium</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <p class="eyebrow">A living system in miniature</p>
      <h1>Digital Paludarium</h1>
      <p class="lede">A small artificial world where plants, herbivores, evolution, and memory shape one another.</p>
    </section>

    <section class="controls" aria-label="Simulation controls">
      <button id="toggleBtn">Pause</button>
      <button id="resetBtn">Reset</button>
      <button id="soundBtn">Sound: off</button>
      <label>Speed <input id="speedRange" type="range" min="0.25" max="3" value="1" step="0.25" /></label>
    </section>

    <section class="stats" aria-live="polite">
      <div><span>Day</span><strong id="dayStat">1</strong></div>
      <div><span>Plants</span><strong id="plantStat">0</strong></div>
      <div><span>Herbivores</span><strong id="herbivoreStat">0</strong></div>
      <div><span>Temperature</span><strong id="tempStat">24°C</strong></div>
    </section>

    <section class="world-card">
      <canvas id="world" aria-label="Animated paludarium simulation"></canvas>
    </section>

    <section class="chronicle-card">
      <div class="section-heading">
        <p class="eyebrow">Memory of the habitat</p>
        <h2>Living chronicle</h2>
      </div>
      <ol id="chronicle" class="chronicle"></ol>
    </section>
  </main>

  <script src="audio-safety.js"></script>
  <script src="main.js"></script>
</body>
</html>
