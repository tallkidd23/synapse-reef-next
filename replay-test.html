<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synapse Reef v2 — Replay Verification</title>
  <style>
    body { margin: 0; padding: 2rem; background: #06110c; color: #e9f4df; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 900px; margin: auto; }
    pre { overflow: auto; padding: 1rem; border: 1px solid #294e37; border-radius: 1rem; background: #0b2218; }
    .pass { color: #b8e68f; }
    .fail { color: #ff9b8e; }
  </style>
</head>
<body>
  <main>
    <h1>Replay verification</h1>
    <p id="status">Running deterministic checks…</p>
    <pre id="report"></pre>
  </main>
  <script src="phase-1-foundation.js"></script>
  <script src="replay-harness.js"></script>
  <script src="world-replay-harness.js"></script>
  <script>
    const foundationResult = SynapseReplay.verify();
    const worldResult = SynapseWorldReplay.verify();
    const passed = foundationResult.passed && worldResult.passed;
    const status = document.getElementById('status');
    status.textContent = passed ? 'PASS — deterministic foundation and ecology replay are healthy.' : 'FAIL — inspect the report.';
    status.className = passed ? 'pass' : 'fail';
    document.getElementById('report').textContent = JSON.stringify({
      passed,
      foundation: {
        seed: foundationResult.seed,
        steps: foundationResult.steps,
        identical: foundationResult.identical,
        divergent: foundationResult.divergent,
        bounded: foundationResult.bounded,
      },
      ecology: {
        seed: worldResult.seed,
        ticks: worldResult.ticks,
        sameState: worldResult.sameState,
        sameEvents: worldResult.sameEvents,
        diverges: worldResult.diverges,
        bounded: worldResult.bounded,
        finite: worldResult.finite,
      },
    }, null, 2);
  </script>
</body>
</html>
